name: Release (arm64 slice)

# Builds the arm64 half of a release and uploads it as an artifact. It does NOT
# publish the release — a maintainer combines this with a locally built x86_64
# binary and publishes. See "Releases" in CONTRIBUTING.md.
#
# Why not build both here: the macos-13 (Intel) runner has never once been
# assigned to this repository — six consecutive attempts, each sitting queued
# indefinitely and never starting. A job that hangs forever is worse than one
# that doesn't exist: it blocks the run, blocks anything downstream, and has to
# be cancelled by hand every time. So CI builds the slice it can actually build
# and hands over cleanly.
#
# Linux is not buildable from this tree at all — the NAC implementation it would
# need is not public. See the README.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.1.2)'
        required: true

permissions:
  contents: read

env:
  RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: brew install protobuf libolm libheif tmux

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/rustpushgo/target
            third_party/rustpush-upstream
          key: cargo-arm64-${{ hashFiles('**/Cargo.lock', 'third_party/rustpush-upstream.sha') }}
          restore-keys: cargo-arm64-

      - name: Build
        run: |
          set -euo pipefail
          # VERSION must be overridden or the binary reports the Makefile's
          # hardcoded default and `update` cannot tell releases apart.
          BREW="$(brew --prefix)"
          make VERSION="${RAW_TAG#v}" \
            CGO_CFLAGS="-I${BREW}/include" \
            CGO_LDFLAGS="-L${BREW}/lib -L${PWD}"

      - name: Verify the binary
        run: |
          set -euo pipefail
          test -f corten-matrix
          file corten-matrix
          ./corten-matrix --version
          lipo -info corten-matrix

          # Materialise before grepping: `grep -q` exits on first match and
          # SIGPIPEs the writer, which under pipefail reads as "not found".
          strings corten-matrix > /tmp/cm-strings.txt
          ./corten-matrix help > /tmp/cm-help.txt
          for needle in "inline ShareProfile fetch panicked" "Group photo MMCS download panicked"; do
            if ! grep -q "$needle" /tmp/cm-strings.txt; then
              echo "::error::panic guard missing from the binary: $needle"
              exit 1
            fi
          done
          grep -q "update" /tmp/cm-help.txt || {
            echo "::error::update subcommand not advertised in help"; exit 1; }

      - name: Run Go tests
        run: |
          set -euo pipefail
          BREW="$(brew --prefix)"
          CGO_CFLAGS="-I${BREW}/include" CGO_LDFLAGS="-L${BREW}/lib -L${PWD}" \
            go test ./pkg/... ./imessage/...

      - uses: actions/upload-artifact@v4
        with:
          name: corten-matrix-arm64
          path: corten-matrix
          if-no-files-found: error
          # Long enough that a maintainer can finish the release the next day.
          retention-days: 7

      - name: Next steps
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$RAW_TAG"
          VER="${TAG#v}"
          {
            echo "## arm64 slice built"
            echo
            echo "Finish the release on an Intel Mac:"
            echo
            echo '```bash'
            echo "cd ~/src/corten-matrix"
            echo "git fetch origin --tags && git checkout ${TAG}"
            echo "make VERSION=${VER} CGO_CFLAGS=\"-I\$(brew --prefix)/include\" CGO_LDFLAGS=\"-L\$(brew --prefix)/lib -L\$PWD\""
            echo
            echo "cd ~ && rm -rf ~/ci-arm64"
            echo "gh run download ${RUN_ID} --repo ${REPO} --name corten-matrix-arm64 --dir ~/ci-arm64"
            echo "lipo -create -output corten-matrix-macos ~/ci-arm64/corten-matrix ~/src/corten-matrix/corten-matrix"
            echo "codesign --force --sign - --identifier com.lrhodin.corten-matrix corten-matrix-macos"
            echo "codesign --verify --verbose=2 corten-matrix-macos && lipo -info corten-matrix-macos"
            echo "chmod +x corten-matrix-macos && ./corten-matrix-macos --version"
            echo "shasum -a 256 corten-matrix-macos > corten-matrix-macos.sha256"
            echo
            echo "gh release create ${TAG} corten-matrix-macos corten-matrix-macos.sha256 \\"
            echo "  --repo ${REPO} --title \"${TAG}\" --generate-notes"
            echo
            echo "cd ~/src/corten-matrix && git checkout master"
            echo '```'
            echo
            echo "The re-sign after \`lipo\` is mandatory — combining two signed slices"
            echo "invalidates both, and an unsigned binary is SIGKILLed on launch."
          } >> "$GITHUB_STEP_SUMMARY"
